name: Publish to PyPI

# Trusted Publishing (OIDC): no API token is stored anywhere. PyPI must have a
# publisher configured for this repository, this workflow file name and the
# `pypi` environment (Project -> Publishing -> "Add a new publisher").
#
# Release procedure: bump `version` in pyproject.toml, commit, then
#   git tag v<version> && git push origin v<version>

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check that the tag matches pyproject.toml's version
        if: github.ref_type == 'tag'
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          print(f"tag {tag} matches version {version}")
          EOF

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel against stock graphifyy
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet --upgrade pip
          /tmp/smoke/bin/python -m pip install --quiet "graphifyy==0.9.71" dist/*.whl pytest
          cd /tmp && /tmp/smoke/bin/python -c "import graphify.extract as e; assert '.mac' in e._DISPATCH; print('OK: .pth hook active')"
          cd "$GITHUB_WORKSPACE" && /tmp/smoke/bin/python -m pytest tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/graphify-objectscript/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
      contents: write   # to attach the files to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      - name: Create the GitHub release with the same files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
